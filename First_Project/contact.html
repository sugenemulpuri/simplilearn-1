<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contact Page</h1>
    <div>
    <form action="home.html" method="post">
    <div>
    <label>Full Name</label>
    <input id="fullname" placeholder="Enter your full name" type="text" />
    </div>
    <br><
    <div>
    <label>Email</label>
    <input id="email" placeholder="Enter your email" type="email" />
    </div>
    <br>
    <div>
    <label>Password</label>
    <input id="password" placeholder="Enter your password" type="password" required />
    </div>
    <div>
    <label>Age</label>
    <input id="age" placeholder="Enter your age" type="number" />
    </div>
    <br>
    <div>
    <label>DOB</label>
    <input id="dob" type="date" />
    </div>
    <br>
    <div>
    <label>Phone</label>
    <input id="phone" type="tel" />
    </div>
    <br>
    <div>
    <label>Experience Level</label>
    <input id="experience" type="range" min="1" max="25" />
    </div>
    <br>
    <div>
    <label>Upload Resume</label>
    <input name="resume" type="file" />
    </div>
    <br>
    <div>
    <label>Gender</label>
    <input name="gender" type="radio" value="Male" /> Male
    <input name="gender" type="radio" value="Female" /> Female
    </div>
    <br>
    <div>
    <label>Skills</label>
    <input name="skills" type="checkbox" value="Java" /> Java
    <input name="skills" type="checkbox" value="HTML" /> HTML
    <input name="skills" type="checkbox" value="Node.js" /> Node.js
    <input name="skills" type="checkbox" value="React.js" /> React.js
    </div>
    <br>
    <div>
    <label>Country</label>
    <select name="country">
    <option>India</option>
    <option>USA</option>
    <option>Canada</option>
    <option>SA</option>
    <option>Australia</option>
    </select>
    </div>
    <div>
    <label>Address</label>
    <textarea rows="15" columns="20" placeholder="Enter your address"></textarea>
    </div>
    <div>
    <label>Search</label>
    <input type="search" placeholder="search here..."/>
    </div>
    <br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    </form>
    </div>
</body>
</html>
